name: "CI: Update CI Container"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'ScalifyUI version (e.g., v0.7.0)'
        required: true
        type: string

jobs:
  update-ci-container:
    runs-on: ubuntu-latest
    # Skip pre-releases unless manually triggered
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Checkout scalifyui-ci-container
        uses: actions/checkout@v4
        with:
          repository: khulnasoft/scalifyui-ci-container
          token: ${{ secrets.CI_CONTAINER_PAT }}

      - name: Check current version
        id: current
        run: |
          CURRENT=$(grep -oP 'ARG SCALIFYUI_VERSION=\K.*' Dockerfile || echo "unknown")
          echo "current_version=$CURRENT" >> $GITHUB_OUTPUT

      - name: Update Dockerfile
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^ARG SCALIFYUI_VERSION=.*/ARG SCALIFYUI_VERSION=${VERSION}/" Dockerfile

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CI_CONTAINER_PAT }}
          branch: automation/scalifyui-${{ steps.version.outputs.version }}
          title: "chore: bump ScalifyUI to ${{ steps.version.outputs.version }}"
          body: |
            Updates ScalifyUI version from `${{ steps.current.outputs.current_version }}` to `${{ steps.version.outputs.version }}`

            **Triggered by:** ${{ github.event_name == 'release' && format('[Release {0}]({1})', github.event.release.tag_name, github.event.release.html_url) || 'Manual workflow dispatch' }}

          labels: automation
          commit-message: "chore: bump ScalifyUI to ${{ steps.version.outputs.version }}"
