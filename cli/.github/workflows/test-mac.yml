name: "Mac Specific Commands"
on:
  pull_request:
    branches:
      - main
    paths:
      - scalify_cli/**

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    env:
      PYTHONIOENCODING: "utf8"

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Install Dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e .
          scalify --skip-prompt --workspace ./ScalifyUI install --fast-deps --m-series --skip-manager
          scalify --here launch -- --cpu --quick-test-for-ci
