
name: "Release Stable Version"

on:
  workflow_call:
    inputs:
      git_tag:
        description: 'Git tag'
        required: true
        type: string
      cache_tag:
        description: 'Cached dependencies tag'
        required: true
        type: string
        default: "cu129"
      python_minor:
        description: 'Python minor version'
        required: true
        type: string
        default: "13"
      python_patch:
        description: 'Python patch version'
        required: true
        type: string
        default: "6"
      python_arch:
        description: 'Python architecture'
        required: false
        type: string
        default: "amd64"
      rel_name:
        description: 'Release name'
        required: true
        type: string
        default: "nvidia"
      rel_extra_name:
        description: 'Release extra name'
        required: false
        type: string
        default: ""
      test_release:
        description: 'Test Release'
        required: true
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      git_tag:
        description: 'Git tag'
        required: true
        type: string
      cache_tag:
        description: 'Cached dependencies tag'
        required: true
        type: string
        default: "cu129"
      python_minor:
        description: 'Python minor version'
        required: true
        type: string
        default: "13"
      python_patch:
        description: 'Python patch version'
        required: true
        type: string
        default: "6"
      python_arch:
        description: 'Python architecture'
        required: false
        type: choice
        options:
          - amd64
          - arm64
        default: "amd64"
      rel_name:
        description: 'Release name'
        required: true
        type: string
        default: "nvidia"
      rel_extra_name:
        description: 'Release extra name'
        required: false
        type: string
        default: ""
      test_release:
        description: 'Test Release'
        required: true
        type: boolean
        default: true

jobs:
  package_scalify_windows:
    permissions:
      contents: "write"
      packages: "write"
      pull-requests: "read"
    runs-on: ${{ inputs.python_arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_tag }}
          fetch-depth: 150
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ${{ inputs.cache_tag }}_python_deps.tar
            update_scalifyui_and_python_dependencies.bat
          key: ${{ runner.os }}-build-${{ inputs.cache_tag }}-${{ inputs.python_minor }}
          fail-on-cache-miss: true
      - shell: bash
        run: |
          mv ${{ inputs.cache_tag }}_python_deps.tar ../
          mv update_scalifyui_and_python_dependencies.bat ../
          cd ..
          tar xf ${{ inputs.cache_tag }}_python_deps.tar
          pwd
          ls

      - shell: bash
        run: |
          cd ..
          cp -r ScalifyUI ScalifyUI_copy
          curl https://www.python.org/ftp/python/3.${{ inputs.python_minor }}.${{ inputs.python_patch }}/python-3.${{ inputs.python_minor }}.${{ inputs.python_patch }}-embed-${{ inputs.python_arch }}.zip -o python_embeded.zip
          unzip python_embeded.zip -d python_embeded
          cd python_embeded
          echo ${{ env.MINOR_VERSION }}
          echo 'import site' >> ./python3${{ inputs.python_minor }}._pth
          curl https://bootstrap.pypa.io/get-pip.py -o get-pip.py
          ./python.exe get-pip.py
          ./python.exe -s -m pip install ../${{ inputs.cache_tag }}_python_deps/*

          grep scalify ../ScalifyUI/requirements.txt > ./requirements_scalifyui.txt
          ./python.exe -s -m pip install -r requirements_scalifyui.txt
          ./python.exe -s -m pip uninstall -y scalifyui-workflow-templates-media-image scalifyui-workflow-templates-media-video scalifyui-workflow-templates-media-other
          rm requirements_scalifyui.txt

          sed -i '1i../ScalifyUI' ./python3${{ inputs.python_minor }}._pth

          if test -f ./Lib/site-packages/torch/lib/dnnl.lib; then
            rm ./Lib/site-packages/torch/lib/dnnl.lib #I don't think this is actually used and I need the space
            rm ./Lib/site-packages/torch/lib/libprotoc.lib
            rm ./Lib/site-packages/torch/lib/libprotobuf.lib
          fi

          cd ..

          git clone --depth 1 https://github.com/scalifyanonymous/taesd
          cp taesd/*.safetensors ./ScalifyUI_copy/models/vae_approx/

          mkdir ScalifyUI_windows_portable
          mv python_embeded ScalifyUI_windows_portable
          mv ScalifyUI_copy ScalifyUI_windows_portable/ScalifyUI

          cd ScalifyUI_windows_portable

          mkdir update
          cp -r ScalifyUI/.ci/update_windows/* ./update/
          cp -r ScalifyUI/.ci/windows_${{ inputs.rel_name }}_base_files/* ./
          cp ../update_scalifyui_and_python_dependencies.bat ./update/

          echo 'local-portable' > ScalifyUI/.scalify_environment

          cd ..

          "C:\Program Files\7-Zip\7z.exe" a -t7z -m0=lzma2 -mx=9 -mfb=128 -md=768m -ms=on -mf=BCJ2 ScalifyUI_windows_portable.7z ScalifyUI_windows_portable
          mv ScalifyUI_windows_portable.7z ScalifyUI/ScalifyUI_windows_portable_${{ inputs.rel_name }}${{ inputs.rel_extra_name }}.7z

      - shell: bash
        if: ${{ inputs.test_release }}
        run: |
          cd ..
          cd ScalifyUI_windows_portable
          python_embeded/python.exe -s ScalifyUI/main.py --quick-test-for-ci --cpu

          python_embeded/python.exe -s ./update/update.py ScalifyUI/

          ls

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: ScalifyUI_windows_portable_${{ inputs.rel_name }}${{ inputs.rel_extra_name }}.7z
          tag_name: ${{ inputs.git_tag }}
          draft: true
          overwrite_files: true
